[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-rag-retrieval"
version = "0.1.0"
description = "Two-stage session and passage retrieval with optional Jev reranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.5.7"]

[project.scripts]
jev-rag = "jev_rag_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rag_retrieval"]
